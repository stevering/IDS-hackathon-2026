<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        :root {
            /* ── Dark theme (default) ─────────────────────────── */
            --figma-bg: #2C2C2C;
            --figma-bg-hover: #383838;
            --figma-bg-active: #4B4B4B;
            --figma-surface: #383838;
            --figma-border: #454545;
            --figma-text: #FFFFFF;
            --figma-text-muted: #A0A0A0;
            --figma-text-disabled: #6B6B6B;
            --figma-accent: #0D99FF;
            --figma-accent-hover: #38A5F8;
            --figma-success: #0ACF83;
            --figma-warning: #FFAD33;
            --figma-error: #F5493B;
            --figma-shadow: rgba(0, 0, 0, 0.3);
            --radius: 6px;
            --radius-sm: 4px;
            /* Background shown while the webapp iframe loads */
            --iframe-bg: #0a0a0a;
        }

        /* ── Light theme ──────────────────────────────────────── */
        :root.theme-light {
            --figma-bg: #FFFFFF;
            --figma-bg-hover: #F0F0F0;
            --figma-bg-active: #E5E5E5;
            --figma-surface: #F5F5F5;
            --figma-border: #DEDEDE;
            --figma-text: #1A1A1A;
            --figma-text-muted: #6B6B6B;
            --figma-text-disabled: #A0A0A0;
            --figma-shadow: rgba(0, 0, 0, 0.1);
            --iframe-bg: #fafafa;
        }

        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            font-size: 11px;
            background: var(--figma-bg);
            color: var(--figma-text);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            border-radius: 0;
            line-height: 1.4;
        }

        /* ── Header ─────────────────────────────────────────── */
        .header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            background: var(--figma-bg);
        }

        .header-selection {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 3px 6px;
            border-radius: var(--radius-sm);
            font-size: 10px;
            color: var(--figma-text-muted);
            flex-shrink: 0;
        }

        .status-indicator.connected {
            color: var(--figma-success);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }

        /* Figma property-panel style icon buttons */
        .header-icon-btn {
            width: 28px;
            height: 28px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--figma-border);
            background: var(--figma-surface);
            color: var(--figma-text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            flex-shrink: 0;
            position: relative;
            transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
        }

        .header-icon-btn:hover {
            background: var(--figma-bg-active);
            color: var(--figma-text);
            border-color: var(--figma-text-disabled);
        }

        .header-icon-btn svg {
            width: 14px;
            height: 14px;
        }

        /* Green dot indicator on URL button when a file URL is set */
        .url-btn.has-url::after {
            content: '';
            position: absolute;
            top: 2px;
            right: 2px;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--figma-success);
        }

        /* ── Minimized mode ─────────────────────────────────── */
        body.minimized .header,
        body.minimized .content {
            display: none;
        }

        /* ── Unauthenticated mode: hide selection header + plugin params ─── */
        body.unauthenticated .header {
            display: none;
        }

        /* ── Main header (always visible) ───────────────────────── */
        .main-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            height: 44px;
            background: var(--figma-bg);
            border-bottom: 1px solid var(--figma-border);
            cursor: pointer;
            flex-shrink: 0;
            user-select: none;
        }

        .main-header-figure {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 1px 4px rgba(0, 0, 0, 0.5));
            transition: transform 0.15s ease, background 0.15s ease;
            cursor: pointer;
            border-radius: var(--radius-sm);
        }

        .main-header-figure:hover {
            transform: scale(1.15);
            background: var(--figma-bg-active);
        }

        .main-header-message-area {
            flex: 1;
            min-width: 0;
            position: relative;
            font-style: italic;
            height: 100%;
            display: flex;
            align-items: center;
        }

        .main-header-tooltip {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            gap: 7px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .main-header-tooltip.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .main-header-tooltip-text {
            flex: 1;
            min-width: 0;
            font-size: 11px;
            color: var(--figma-text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .main-header-idle-hint {
            font-size: 10px;
            color: var(--figma-text-muted);
            line-height: 1.4;
            pointer-events: none;
            opacity: 1;
            transition: opacity 0.25s ease;
        }

        .main-header-tooltip.visible ~ .main-header-idle-hint {
            opacity: 0;
        }

        .mini-analyze-btn {
            flex-shrink: 0;
            width: 26px;
            height: 26px;
            border: none;
            border-radius: 6px;
            background: var(--figma-accent);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
            padding: 0;
        }

        .mini-analyze-btn:hover {
            background: var(--figma-accent-hover);
            transform: scale(1.12);
            box-shadow: 0 0 8px rgba(13, 153, 255, 0.5);
        }

        .mini-analyze-btn svg {
            width: 14px;
            height: 14px;
        }

        /* ── Content ─────────────────────────────────────────── */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .selection-avatar {
            width: 24px;
            height: 24px;
            border-radius: var(--radius-sm);
            background: var(--figma-surface);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            flex-shrink: 0;
        }

        .selection-info-text {
            flex: 1;
            font-size: 11px;
        }

        .selection-count {
            color: var(--figma-text-muted);
        }

        .selection-count strong {
            color: var(--figma-text);
        }

        .webview-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--iframe-bg);
            border-radius: var(--radius-sm);
            overflow: hidden;
        }

        .webview-iframe {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            background: var(--iframe-bg);
        }

        .empty-state {
            flex: 1;
            display: none;
        }

        .chat-container {
            display: none;
        }

        /* ── Config button icon size override ───────────────── */
        .url-btn svg {
            width: 24px;
            height: 24px;
        }

        /* ── Panel area (wrapper isolating animation from main-header) ─────── */
        .plugin-panel-area {
            position: relative;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* clips translateX animation */
            min-height: 0;
        }

        /* ── Config panel (slides in from right, covers .header + .content) ── */
        .config-panel {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--figma-bg);
            z-index: 50;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            pointer-events: none;
            transition: transform 0.25s ease;
        }

        .config-panel.open {
            transform: translateX(0);
            pointer-events: auto;
        }

        .config-panel-header {
            display: flex;
            align-items: center;
            padding: 8px 10px;
            border-bottom: 1px solid var(--figma-border);
            flex-shrink: 0;
            gap: 8px;
        }

        .config-panel-title {
            flex: 1;
            font-size: 12px;
            font-weight: 600;
            color: var(--figma-text);
        }

        /* Close button aligns with url-btn on the right — same position, same height */
        #config-close-btn {
            flex-shrink: 0;
        }

        .config-panel-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .config-section-label {
            font-size: 10px;
            color: var(--figma-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .config-context-block {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .config-context-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .config-context-field-label {
            font-size: 10px;
            color: var(--figma-text-muted);
        }

        .config-context-input {
            width: 100%;
            background: var(--figma-surface);
            border: 1px solid var(--figma-border);
            border-radius: var(--radius-sm);
            color: var(--figma-text-disabled);
            font-family: inherit;
            font-size: 11px;
            padding: 6px 8px;
            outline: none;
            cursor: default;
            user-select: text;
        }

        .config-context-empty {
            font-size: 11px;
            color: var(--figma-text-disabled);
            font-style: italic;
        }

        /* ── Selection preview in config panel ──────────────── */
        .selection-preview {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            background: var(--figma-surface);
            border: 1px solid var(--figma-border);
            border-radius: var(--radius-sm);
            cursor: default;
        }
        .selection-preview-thumb {
            width: 36px;
            height: 36px;
            border-radius: 3px;
            background: var(--figma-bg);
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            flex-shrink: 0;
            border: 1px solid var(--figma-border);
        }
        .selection-preview-info {
            flex: 1;
            min-width: 0;
        }
        .selection-preview-name {
            font-size: 11px;
            font-weight: 500;
            color: var(--figma-text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .selection-preview-meta {
            font-size: 10px;
            color: var(--figma-text-muted);
            margin-top: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .selection-preview-expand {
            background: none;
            border: 1px solid var(--figma-border);
            color: var(--figma-text-muted);
            border-radius: var(--radius-sm);
            width: 20px;
            height: 20px;
            cursor: pointer;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.1s, color 0.1s;
        }
        .selection-preview-expand:hover {
            background: var(--figma-bg-hover);
            color: var(--figma-text);
        }
        .selection-preview-expand.open {
            color: var(--figma-accent);
            border-color: var(--figma-accent);
        }
        .selection-json {
            display: none;
            margin-top: 4px;
            background: var(--figma-bg);
            border: 1px solid var(--figma-border);
            border-radius: var(--radius-sm);
            padding: 6px 8px;
            font-size: 10px;
            font-family: 'SF Mono', 'Fira Code', monospace;
            color: var(--figma-text-muted);
            max-height: 160px;
            overflow-y: auto;
            white-space: pre;
            line-height: 1.5;
        }
        .selection-json.open { display: block; }

        .url-input {
            width: 100%;
            background: var(--figma-bg);
            border: 1px solid var(--figma-border);
            border-radius: var(--radius-sm);
            color: var(--figma-text);
            font-family: inherit;
            font-size: 11px;
            padding: 7px 8px;
            outline: none;
            transition: border-color 0.15s ease;
        }

        .url-input:focus {
            border-color: var(--figma-accent);
        }

        .url-input::placeholder {
            color: var(--figma-text-disabled);
        }

        .url-error {
            font-size: 10px;
            color: var(--figma-error);
            margin-top: 5px;
            display: none;
        }

        /* ── Theme toggle button ─────────────────────────────── */
        .theme-toggle-btn {
            flex-shrink: 0;
            width: 26px;
            height: 26px;
            border: 1px solid var(--figma-border);
            background: var(--figma-surface);
            color: var(--figma-text-muted);
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            line-height: 1;
            padding: 0;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
        }

        .theme-toggle-btn:hover {
            background: var(--figma-bg-active);
            color: var(--figma-text);
            border-color: var(--figma-text-disabled);
        }

    </style>
</head>

<script>
    // Detect if the plugin is in cloud mode (iframe loads a remote URL, not localhost)
    const _guardianIframeSrc = document.getElementById('webview-iframe')?.getAttribute('src') || '';
    const isCloudMode = _guardianIframeSrc.startsWith('https://');
    if (isCloudMode) console.log('[Guardian] Cloud mode detected — skipping local WS scans');

    // Trusted origin for the webapp iframe — used to validate postMessage sources
    // and restrict outgoing messages. Derived from the iframe src set at build time.
    var guardianOrigin;
    try { guardianOrigin = new URL(_guardianIframeSrc).origin; } catch(e) { guardianOrigin = '*'; }

    const mainAvatar = document.getElementById('main-avatar');
    const selectionStats = document.getElementById('selection-stats');
    const statusEl = document.getElementById('status');
    const webviewIframe = document.getElementById('webview-iframe');
    const urlBtn = document.getElementById('url-btn');
    const configPanel = document.getElementById('config-panel');
    const configCloseBtn = document.getElementById('config-close-btn');
    const urlInput = document.getElementById('url-input');
    const urlError = document.getElementById('url-error');
    const configContextBlock = document.getElementById('config-context-block');
    const configSelectionBlock = document.getElementById('config-selection-block');

    const NORMAL_WIDTH = 400;
    const NORMAL_HEIGHT = 800;
    const MINI_HEIGHT = 44;
    const FIGMA_URL_KEY = 'figpal_file_url';
    const FIGMA_FNAME_KEY = 'figpal_file_name';
    const FIGMA_URL_RE = /figma\.com\/(design|file|board)\/([^\/\?]+)/;
    const THEME_KEY = 'guardianTheme';
    const THEME_CYCLE = ['system', 'dark', 'light'];
    const THEME_ICONS = { system: '🖥️', dark: '🌙', light: '☀️' };
    const THEME_LABELS = { system: 'System', dark: 'Dark', light: 'Light' };

    // clientStorage helpers (go through code.js — localStorage unavailable in data: URLs)
    function storageGet(key) {
        parent.postMessage({ pluginMessage: { type: 'storage-get', data: { key } } }, '*');
    }
    function storageSet(key, value) {
        parent.postMessage({ pluginMessage: { type: 'storage-set', data: { key, value } } }, '*');
    }

    const DEFAULT_GHOST = "https://raw.githubusercontent.com/josh-one/figpal/main/assets/ghost.png";
    let isConnected = false;
    const inFigmaPlugin = window !== window.top;
    let cachedFigmaContext = null;
    let cachedSelection = null; // { nodes, image, nodeUrl }
    // Saved URL data from clientStorage: { url, fileName, fileKey }
    let savedUrlData = null;

    // ── Theme state ────────────────────────────────────────
    let currentTheme = 'system'; // 'dark' | 'light' | 'system'

    function getEffectiveTheme(theme) {
        if (theme === 'system') {
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        return theme;
    }

    function applyTheme(theme) {
        currentTheme = theme;
        const effective = getEffectiveTheme(theme);
        document.documentElement.classList.toggle('theme-light', effective === 'light');
        const btn = document.getElementById('theme-toggle-btn');
        if (btn) {
            btn.textContent = THEME_ICONS[theme];
            btn.title = 'Theme: ' + THEME_LABELS[theme] + ' — click to cycle';
        }
        // Send to webapp (if loaded)
        sendToWebview({ type: 'set-theme', theme: effective });
    }

    // Apply system default immediately (before storage restore)
    applyTheme('system');

    // Respond to OS theme changes when in system mode
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
        if (currentTheme === 'system') applyTheme('system');
    });

    // ── Auth state ─────────────────────────────────────────
    let isAuthenticated = false;
    let loginPromptTimer = null;

    function applyAuthState(authenticated) {
        isAuthenticated = authenticated;
        document.body.classList.toggle('unauthenticated', !authenticated);
        // Notify the Electron overlay via bridge
        document.dispatchEvent(new CustomEvent('guardian-auth-state', { detail: { authenticated } }));
        if (!authenticated) {
            scheduleLoginPrompt();
        } else {
            clearLoginPrompt();
        }
    }

    function scheduleLoginPrompt() {
        clearLoginPrompt();
        // Fire once every ~60s (45–75s window for randomness)
        const delay = 45000 + Math.random() * 30000;
        loginPromptTimer = setTimeout(function () {
            loginPromptTimer = null;
            if (!isAuthenticated) {
                parent.postMessage({ pluginMessage: { type: 'notify-login-prompt' } }, '*');
                scheduleLoginPrompt();
            }
        }, delay);
    }

    function clearLoginPrompt() {
        if (loginPromptTimer) {
            clearTimeout(loginPromptTimer);
            loginPromptTimer = null;
        }
    }

    console.log('[FigPal UI] Script started. inFigmaPlugin =', inFigmaPlugin);

    const mainHeaderEl = document.getElementById('main-header');
    const mainHeaderTooltipEl = document.getElementById('main-header-tooltip');
    const mainHeaderTooltipText = document.getElementById('main-header-tooltip-text');
    const mainHeaderAnalyzeBtn = document.getElementById('main-header-analyze-btn');

    const MINI_MESSAGES = [
        "Spotted something new! Want me to analyze it? ✨",
        "New selection detected — should I check it?",
        "Interesting component! Shall I audit it? 🔍",
        "I see you selected something. Run an analysis?",
        "New element! Want an AI design review? 🛡️",
        "Looking good — want me to verify its consistency?",
        "Component changed! Should I inspect it?",
        "Found your selection. Want me to audit it?",
        "I noticed a new selection — run an analysis?",
        "Design check ready. Shall I proceed? ✨"
    ];

    let currentTooltipMessage = null;
    let tooltipTimer = null;

    function showMiniTooltip(nodeName) {
        const base = MINI_MESSAGES[Math.floor(Math.random() * MINI_MESSAGES.length)];
        currentTooltipMessage = nodeName ? `"${nodeName}" — ${base}` : base;
        mainHeaderTooltipText.textContent = currentTooltipMessage;
        mainHeaderTooltipEl.classList.add('visible');
        mainHeaderEl.classList.add('has-message');
        clearTimeout(tooltipTimer);
        tooltipTimer = setTimeout(hideMiniTooltip, 8000);
    }

    function hideMiniTooltip() {
        mainHeaderTooltipEl.classList.remove('visible');
        mainHeaderEl.classList.remove('has-message');
    }

    // ── Minimize / Maximize ───────────────────────────────
    function setMinimized(mini) {
        document.body.classList.toggle('minimized', mini);
        parent.postMessage({
            pluginMessage: {
                type: 'resize',
                data: mini
                    ? { width: NORMAL_WIDTH, height: MINI_HEIGHT }
                    : { width: NORMAL_WIDTH, height: NORMAL_HEIGHT }
            }
        }, '*');
    }

    // 🛡️ Shield → toggle mini ↔ expanded, without touching the conversation
    document.getElementById('main-header-figure').addEventListener('click', (e) => {
        e.stopPropagation();
        setMinimized(!document.body.classList.contains('minimized'));
    });

    // Message text → expand only (no inject, no minimize)
    mainHeaderTooltipText.addEventListener('click', (e) => {
        e.stopPropagation();
        if (document.body.classList.contains('minimized')) setMinimized(false);
    });

    // Main header: toggle mini ↔ expanded
    // If a message is visible → expand only (never minimize)
    mainHeaderEl.addEventListener('click', () => {
        const isMini = document.body.classList.contains('minimized');
        if (mainHeaderEl.classList.contains('has-message')) {
            if (isMini) setMinimized(false);
            // expanded + has-message → stay expanded
        } else {
            setMinimized(!isMini);
        }
    });

    // Hover on header → pause the message timer
    mainHeaderEl.addEventListener('mouseenter', () => {
        if (mainHeaderEl.classList.contains('has-message')) clearTimeout(tooltipTimer);
    });
    mainHeaderEl.addEventListener('mouseleave', () => {
        if (mainHeaderEl.classList.contains('has-message')) {
            tooltipTimer = setTimeout(hideMiniTooltip, 8000);
        }
    });

    // ⭐ Star → blank conversation + expand if needed + inject message + auto-analyze
    mainHeaderAnalyzeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (document.body.classList.contains('minimized')) setMinimized(false);
        if (currentTooltipMessage) {
            const msg = currentTooltipMessage;
            currentTooltipMessage = null;
            hideMiniTooltip();
            sendToWebview({ type: 'reset-conversation' });
            setTimeout(function () {
                sendToWebview({ type: 'inject-agent-message', text: msg });
                setTimeout(function () {
                    sendToWebview({ type: 'trigger-user-analysis' });
                }, 400);
            }, 200);
        }
    });

    // ── Figma URL Modal ───────────────────────────────────
    function extractFileKey(url) {
        const m = url.match(FIGMA_URL_RE);
        return m ? m[2] : null;
    }

    function validateUrlInput(val) {
        const valid = FIGMA_URL_RE.test(val.trim());
        urlError.style.display = (val.trim() && !valid) ? 'block' : 'none';
    }

    function applyFigmaUrl(url) {
        const fileKey = extractFileKey(url);
        if (!fileKey) return false;
        // Associate URL with the current file name so we can validate on file switch
        const fileName = cachedFigmaContext?.fileName || '';
        savedUrlData = { url, fileName, fileKey };
        storageSet(FIGMA_URL_KEY, url);
        storageSet(FIGMA_FNAME_KEY, fileName);
        cachedFigmaContext = {
            ...cachedFigmaContext,
            type: 'figma-context',
            fileKey,
            fileName: fileName || 'Figma File',
            fileUrl: `https://www.figma.com/design/${fileKey}/`,
        };
        console.log('[FigPal UI] Figma URL applied:', cachedFigmaContext);
        sendToWebview(cachedFigmaContext);
        try { window.top.postMessage({ source: 'figpal-plugin', ...cachedFigmaContext }, '*'); } catch (e) {}
        urlBtn.classList.add('has-url');
        return true;
    }

    function openConfigPanel() {
        const saved = savedUrlData?.url || '';
        urlInput.value = saved;
        validateUrlInput(saved);
        updateContextDisplay();
        updateSelectionDisplay();
        configPanel.classList.add('open');
        setTimeout(() => urlInput.focus(), 50);
        if (!cachedFigmaContext) requestAndSendFigmaContext();
    }

    function closeConfigPanel() {
        configPanel.classList.remove('open');
    }

    function updateContextDisplay() {
        const ctx = cachedFigmaContext;
        if (!ctx) {
            configContextBlock.innerHTML = '<span class="config-context-empty">No context loaded yet</span>';
            return;
        }
        function field(label, value) {
            const v = (value || '').toString().replace(/"/g, '&quot;');
            return `<div class="config-context-field">
                    <span class="config-context-field-label">${label}</span>
                    <input class="config-context-input" readonly value="${v}" />
                </div>`;
        }
        const sections = [];
        // File
        sections.push(field('Type', ctx.type));
        sections.push(field('File Name', ctx.fileName));
        sections.push(field('File Key', ctx.fileKey));
        sections.push(field('File URL', ctx.fileUrl));
        // Page
        if (ctx.currentPage) {
            sections.push(field('Current Page', ctx.currentPage.name));
        }
        if (ctx.pages && ctx.pages.length) {
            sections.push(field('Pages', ctx.pages.map(p => p.name).join(', ')));
        }
        // User
        if (ctx.currentUser) {
            sections.push(field('User', ctx.currentUser.name));
        }
        configContextBlock.innerHTML = sections.join('');
    }

    function updateSelectionDisplay() {
        const sel = cachedSelection;
        if (!sel || !sel.nodes || sel.nodes.length === 0) {
            configSelectionBlock.innerHTML = '<span class="config-context-empty">No selection</span>';
            return;
        }
        const first = sel.nodes[0];
        const name = first.name || '(unnamed)';
        const type = first.type || '';
        const b = first.bounds;
        const dims = b ? `${Math.round(b.width)}×${Math.round(b.height)} @ (${Math.round(b.x)}, ${Math.round(b.y)})` : '';
        const count = sel.nodes.length;
        const countLabel = count > 1 ? `${count} nodes` : '1 node';
        // JSON without image field
        const jsonObj = sel.nodes.map(n => {
            const { ...rest } = n;
            return rest;
        });
        const jsonStr = JSON.stringify(jsonObj, null, 2);
        const thumbStyle = sel.image ? `background-image:url('${sel.image}')` : '';
        configSelectionBlock.innerHTML = `
                <div class="selection-preview">
                    <div class="selection-preview-thumb" style="${thumbStyle}"></div>
                    <div class="selection-preview-info">
                        <div class="selection-preview-name">${name.replace(/</g,'&lt;')}</div>
                        <div class="selection-preview-meta">${type} · ${countLabel}${dims ? ' · ' + dims : ''}</div>
                    </div>
                    <button class="selection-preview-expand" id="sel-expand-btn" title="Show JSON">›</button>
                </div>
                <pre class="selection-json" id="sel-json">${jsonStr.replace(/</g,'&lt;')}</pre>`;
        document.getElementById('sel-expand-btn').addEventListener('click', () => {
            const json = document.getElementById('sel-json');
            const btn = document.getElementById('sel-expand-btn');
            const open = json.classList.toggle('open');
            btn.classList.toggle('open', open);
            btn.textContent = open ? '‹' : '›';
        });
    }

    urlBtn.addEventListener('click', openConfigPanel);
    configCloseBtn.addEventListener('click', closeConfigPanel);

    urlInput.addEventListener('input', () => {
        const val = urlInput.value.trim();
        validateUrlInput(val);
        if (FIGMA_URL_RE.test(val)) {
            applyFigmaUrl(val);
            updateContextDisplay();
        } else if (val === '') {
            // URL cleared — strip fileKey/fileUrl from context and storage
            savedUrlData = null;
            storageSet(FIGMA_URL_KEY, '');
            storageSet(FIGMA_FNAME_KEY, '');
            if (cachedFigmaContext) {
                cachedFigmaContext = { ...cachedFigmaContext, fileKey: null, fileUrl: null };
                sendToWebview(cachedFigmaContext);
                try { window.top.postMessage({ source: 'figpal-plugin', ...cachedFigmaContext }, '*'); } catch (e) {}
            }
            urlBtn.classList.remove('has-url');
            updateContextDisplay();
        }
    });

    urlInput.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeConfigPanel();
    });

    // If savedUrlData matches the current open file, apply it to context
    function applySavedUrlIfCoherent() {
        if (!savedUrlData?.fileKey || !cachedFigmaContext) return;
        if (savedUrlData.fileName && savedUrlData.fileName === cachedFigmaContext.fileName) {
            cachedFigmaContext.fileKey = savedUrlData.fileKey;
            cachedFigmaContext.fileUrl = `https://www.figma.com/design/${savedUrlData.fileKey}/`;
            sendToWebview(cachedFigmaContext);
            urlBtn.classList.add('has-url');
        }
    }

    // Restore saved URL on startup (two separate plain-string keys)
    storageGet(FIGMA_URL_KEY);
    storageGet(FIGMA_FNAME_KEY);
    // Restore saved theme
    storageGet(THEME_KEY);

    // Theme toggle button: cycle system → dark → light → system
    document.getElementById('theme-toggle-btn').addEventListener('click', function (e) {
        e.stopPropagation();
        const idx = THEME_CYCLE.indexOf(currentTheme);
        const next = THEME_CYCLE[(idx + 1) % THEME_CYCLE.length];
        applyTheme(next);
        storageSet(THEME_KEY, next);
    });

    // ── Connection & messaging ────────────────────────────
    function passAuthTokensToIframe() {
        // The extension content script sends tokens directly to the iframe
    }

    function broadcastReady() {
        const msg = { source: 'figpal-plugin', type: 'plugin-ready' };
        if (!inFigmaPlugin) {
            try { window.top.postMessage(msg, '*'); } catch (e) { }
        }
    }
    broadcastReady();
    const bootInterval = inFigmaPlugin ? null : setInterval(broadcastReady, 2000);

    // Request Figma context on startup (plugin mode — gets fileName from figma.root.name)
    if (inFigmaPlugin) {
        console.log('[FigPal UI] Plugin mode → requestAndSendFigmaContext in 500ms');
        setTimeout(requestAndSendFigmaContext, 500);
    }

    function updateConnectionStatus(connected) {
        isConnected = connected;
        statusEl.className = connected ? 'status-indicator connected' : 'status-indicator';
        statusEl.querySelector('span').textContent = connected ? 'Connected' : 'Connecting...';
        // Notify the Guardian widget of the backend status to update its badge
        parent.postMessage({ pluginMessage: {
            type: 'BACKEND_STATUS',
            status: connected ? 'connected' : 'error',
            text: connected ? 'connected' : 'offline',
        }}, '*');
    }

    function sendToWebview(data) {
        try {
            webviewIframe.contentWindow.postMessage(data, guardianOrigin);
        } catch (e) {
            console.log('Webview not ready:', e);
        }
    }

    function requestAndSendFigmaContext() {
        parent.postMessage({ pluginMessage: { type: 'get-file-info', id: 'figma-context-init' } }, '*');
    }

    webviewIframe.onload = function () {
        console.log('[FigPal UI] iframe webapp loaded → requestAndSendFigmaContext in 800ms');
        // Apply current theme to the newly loaded iframe immediately
        setTimeout(function () {
            sendToWebview({ type: 'set-theme', theme: getEffectiveTheme(currentTheme) });
        }, 50);
        setTimeout(passAuthTokensToIframe, 500);
        setTimeout(requestAndSendFigmaContext, 800);
    };

    window.onmessage = (event) => {
        const data = event.data;

        // Handle messages from overlay
        if (data && data.type === 'FROM_OVERLAY') {
            if (data.action === 'START_NEW_CONVERSATION') {
                // Expand the plugin if minimized
                if (document.body.classList.contains('minimized')) {
                    setMinimized(false);
                }

                // Reset conversation and start analysis (similar to main-header-analyze-btn click)
                sendToWebview({ type: 'reset-conversation' });
                setTimeout(function () {
                    sendToWebview({ type: 'inject-agent-message', text: 'New analysis requested from Guardian overlay' });
                    setTimeout(function () {
                        sendToWebview({ type: 'trigger-user-analysis' });
                    }, 400);
                }, 200);
            }
            return;
        }

        // First communication from the webapp (or extension) → connected
        if (!isConnected && data && (data.source === 'figpal-webapp' || data.source === 'figpal-extension')) {
            updateConnectionStatus(true);
        }

        if (data && data.source === 'figpal-extension') {
            clearInterval(bootInterval);
            updateConnectionStatus(true);

            if (data.type === 'ping') {
                try { window.top.postMessage({ source: 'figpal-plugin', type: 'pong' }, '*'); } catch (e) {}
            } else if (data.type === 'mcp-tokens') {
                console.log('Plugin received MCP tokens, forwarding to iframe');
                sendToWebview(data);
            } else if (data.type && data.type !== 'handshake-ack') {
                parent.postMessage({ pluginMessage: data }, '*');
                sendToWebview(data);
            }
        }

        const msg = data.pluginMessage;
        if (!msg) return;

        // Handle clientStorage read responses (two separate keys)
        if (msg.type === 'storage-value' && msg.key === THEME_KEY) {
            const saved = msg.value;
            if (saved && THEME_CYCLE.includes(saved)) {
                applyTheme(saved);
            }
            return;
        }

        if (msg.type === 'storage-value' && msg.key === FIGMA_URL_KEY) {
            if (msg.value && typeof msg.value === 'string') {
                if (!savedUrlData) savedUrlData = { url: '', fileName: '', fileKey: null };
                savedUrlData.url = msg.value;
                savedUrlData.fileKey = extractFileKey(msg.value);
                console.log('[FigPal UI] URL restored:', msg.value);
                // Check coherence once we have both values
                applySavedUrlIfCoherent();
            }
            return;
        }

        if (msg.type === 'storage-value' && msg.key === FIGMA_FNAME_KEY) {
            if (!savedUrlData) savedUrlData = { url: '', fileName: '', fileKey: null };
            savedUrlData.fileName = msg.value || '';
            console.log('[FigPal UI] fileName restored:', msg.value);
            applySavedUrlIfCoherent();
            return;
        }

        if (msg.type === 'selection-change-triggered') {
            parent.postMessage({ pluginMessage: { type: 'get-selection', id: 'auto-stream' } }, '*');
        }

        // Login prompt button clicked in Figma notification → maximize plugin
        if (msg.type === 'login-prompt-clicked') {
            if (document.body.classList.contains('minimized')) setMinimized(false);
            return;
        }

        // Handle Figma file context response
        if (msg.type === 'page-changed') {
            if (cachedFigmaContext) {
                cachedFigmaContext.currentPage = msg.data.currentPage;
                cachedFigmaContext.pages = msg.data.pages;
                sendToWebview(cachedFigmaContext);
                if (configPanel.classList.contains('open')) updateContextDisplay();
            }
        }

        if (msg.type === 'response' && (msg.id === 'figma-context-init' || msg.id === 'fc-bridge-init')) {
            const { name, fileKey, currentPage, pages, currentUser } = msg.data || {};
            const currentName = name || 'Untitled';

            // savedUrlData is only valid if its fileName matches the current file
            const savedKeyValid = savedUrlData?.fileKey && savedUrlData.fileName === currentName;

            cachedFigmaContext = {
                type: 'figma-context',
                fileKey: fileKey || (savedKeyValid ? savedUrlData.fileKey : null),
                fileName: currentName,
                fileUrl: fileKey
                    ? `https://www.figma.com/design/${fileKey}/`
                    : (savedKeyValid ? `https://www.figma.com/design/${savedUrlData.fileKey}/` : null),
                currentPage: currentPage || null,
                pages: pages || [],
                currentUser: currentUser || null,
            };

            // Update URL button indicator
            if (savedKeyValid || fileKey) {
                urlBtn.classList.add('has-url');
            } else {
                urlBtn.classList.remove('has-url');
            }

            sendToWebview(cachedFigmaContext);
            try { window.top.postMessage({ source: 'figpal-plugin', ...cachedFigmaContext }, '*'); } catch (e) {}
            if (configPanel.classList.contains('open')) updateContextDisplay();
            // Broadcast FILE_INFO to FC MCP servers so they recognize the connection
            if (typeof _fcBroadcast === 'function') _fcBroadcast({ type: 'FILE_INFO', data: cachedFigmaContext });
            // Refresh the bridge registration with the now-known fileKey/fileName
            // so the Electron overlay menu can show a proper file label.
            try { window.__guardianBridgeReRegister?.(); } catch (e) { /* ignore */ }
            return;
        }

        if (msg.type === 'response' || msg.type === 'selection-changed' || msg.type === 'ai-response') {
            const nodes = msg.data?.nodes;
            const image = msg.data?.image;

            // When not authenticated: ignore all selection UI updates
            if (!isAuthenticated && msg.type === 'selection-changed') {
                return;
            }

            if (Array.isArray(nodes)) {
                selectionStats.innerHTML = nodes.length > 0
                    ? `<strong>${nodes.length}</strong> ${nodes.length === 1 ? 'layer' : 'layers'} selected`
                    : 'No selection active';
            }

            if (image && mainAvatar) {
                mainAvatar.style.backgroundImage = `url('${image}')`;
            } else if (mainAvatar) {
                mainAvatar.style.backgroundImage = '';
            }

            // Tooltip: on each new selection (mini or expanded)
            if (msg.type === 'selection-changed'
                && Array.isArray(nodes) && nodes.length > 0) {
                showMiniTooltip(nodes[0]?.name || '');
            }

            // Cache the selection for the config panel
            if (msg.type === 'selection-changed') {
                cachedSelection = msg.data || null;
                if (configPanel.classList.contains('open')) updateSelectionDisplay();
            }

        }

        // ── Proxy RPC results — route to FigmaProxy client ────────────────
        if (msg.type === 'PROXY_RESULT') {
            if (typeof FigmaProxy !== 'undefined') FigmaProxy._handleResult(msg);
            return; // internal message, don't forward to webview
        }

        // ── Cache variables data for FC Bridge handshake & GET_VARIABLES_DATA ──
        if (msg.type === 'VARIABLES_DATA') {
            window.__cachedVariablesData = msg.data || msg;
        }

        // ── Forward EXECUTE_CODE_RESULT to Proxy client (for executeCode calls) ──
        if (msg.type === 'EXECUTE_CODE_RESULT' && typeof FigmaProxy !== 'undefined') {
            FigmaProxy._handleResult(msg);
        }

        // ── Broadcast Figma events to connected FC MCP servers ──
        if (typeof _fcBroadcast === 'function') {
            if (msg.type === 'DOCUMENT_CHANGE') _fcBroadcast({ type: 'DOCUMENT_CHANGE', data: msg.data });
            if (msg.type === 'CONSOLE_CAPTURE') _fcBroadcast(msg);
            if (msg.type === 'selection-changed') _fcBroadcast({ type: 'SELECTION_CHANGE', data: msg.data });
            if (msg.type === 'page-changed') _fcBroadcast({ type: 'PAGE_CHANGE', data: msg.data });
            if (msg.type === 'VARIABLES_DATA') _fcBroadcast({ type: 'VARIABLES_DATA', data: msg.data || msg });
        }

        // Always relay every code.js message to the webview iframe (catch-all)
        // This covers: response, selection-changed, ai-response, typing,
        // EXECUTE_CODE_RESULT, VARIABLES_DATA, figpal-init, and any future types.
        sendToWebview(msg);

        try { window.top.postMessage({ source: 'figpal-plugin', type: msg.type, id: msg.id, data: msg.data }, '*'); } catch (e) {}
    };

    mainAvatar.style.backgroundImage = '';

    window.addEventListener('message', (event) => {
        // Only accept messages from the trusted webapp origin
        if (guardianOrigin !== '*' && event.origin !== guardianOrigin) return;
        if (event.data && event.data.source === 'figpal-webapp') {
            if (event.data.type === 'AUTH_STATE') {
                applyAuthState(!!event.data.authenticated);
                return;
            }
            if (event.data.type === 'request-figma-context') {
                if (cachedFigmaContext) {
                    sendToWebview(cachedFigmaContext);
                } else {
                    requestAndSendFigmaContext();
                }
                return;
            }
            // Instant FC MCP connection triggered by Temporal subprocess
            if (event.data.type === 'CONNECT_FC_PORT' && event.data.data?.port) {
                if (typeof window.__connectFCPort === 'function') {
                    window.__connectFCPort(event.data.data.port);
                }
                return;
            }
            // Cloud relay connection triggered by orchestration (production/preview)
            if (event.data.type === 'CONNECT_FC_CLOUD_RELAY' && event.data.data?.code) {
                console.log('[FC Bridge] Received CONNECT_FC_CLOUD_RELAY with code ' + event.data.data.code);
                if (typeof window.__connectFCCloudRelay === 'function') {
                    window.__connectFCCloudRelay(event.data.data.code);
                } else {
                    console.warn('[FC Bridge] __connectFCCloudRelay not available yet');
                }
                return;
            }
            parent.postMessage({ pluginMessage: event.data }, '*');
        }
    });

    // ── Figma Proxy Client ─────────────────────────────────────────────────────
    // Async wrapper around postMessage-based RPC to the Proxy Handler in code.ts.
    // Used by the FC WS Bridge adapters and available for Guardian internal use.
    // ───────────────────────────────────────────────────────────────────────────
    var FigmaProxy = (function () {
        var pending = {};
        var counter = 0;

        function send(msgType, data, timeout) {
            timeout = timeout || 15000;
            return new Promise(function (resolve, reject) {
                var requestId = '__proxy_' + (++counter);
                var timer = setTimeout(function () {
                    delete pending[requestId];
                    reject(new Error('Proxy timeout after ' + timeout + 'ms'));
                }, timeout);
                pending[requestId] = { resolve: resolve, reject: reject, timer: timer };
                parent.postMessage({ pluginMessage: Object.assign({ type: msgType, requestId: requestId }, data) }, '*');
            });
        }

        function handleResult(msg) {
            var id = msg.requestId || msg.id;
            var p = pending[id];
            if (!p) return false;
            clearTimeout(p.timer);
            delete pending[id];
            if (msg.error) { p.reject(new Error(msg.error)); }

        function broadcastToAll(message) {
            var json = JSON.stringify(message);
            activeConnections.forEach(function (conn) {
                if (conn.ws.readyState === 1) {
                    try { conn.ws.send(json); } catch (e) { /* ignore */ }
                }
            });
        }
        _fcBroadcast = broadcastToAll;

        function initializeConnection(connWs) {
            // Send cached variables if available
            if (window.__cachedVariablesData) {
                connWs.send(JSON.stringify({ type: 'VARIABLES_DATA', data: window.__cachedVariablesData }));
            }
            // Actively request file info from code.ts (like the native plugin does)
            // so the MCP server recognizes the connection even if cache isn't ready yet
            FigmaProxy.call('figma', 'getFileKey', []).catch(function() { return null; });
            parent.postMessage({ pluginMessage: { type: 'get-file-info', id: 'fc-bridge-init' } }, '*');
            // Send cached file info immediately if available, fresh one arrives via onmessage later
            if (cachedFigmaContext) {
                connWs.send(JSON.stringify({ type: 'FILE_INFO', data: cachedFigmaContext }));
            }
        }

        function attachWsHandlers(activeWs, port) {
            activeWs.onmessage = function (event) {
                try {
                    var message = JSON.parse(event.data);
                    if (!message.id || !message.method) return;

                    var adapter = fcMethods[message.method];
                    if (!adapter) {
                        activeWs.send(JSON.stringify({ id: message.id, error: 'Unknown method: ' + message.method }));
                        return;
                    }

                    Promise.resolve(adapter(FigmaProxy, message.params || {}))
                        .then(function (result) {
                            if (activeWs.readyState === 1) activeWs.send(JSON.stringify({ id: message.id, result: result }));
                        })
                        .catch(function (err) {
                            if (activeWs.readyState === 1) activeWs.send(JSON.stringify({ id: message.id, error: err.message || String(err) }));
                        });
                } catch (e) {
                    console.error('[FC Bridge] Failed to process message from port ' + port, e);
                }
            };

            activeWs.onclose = function (event) {
                removeConnection(port);
                console.log('[FC Bridge] Disconnected from port ' + port + ' (' + activeConnections.length + ' remaining)');
                var wasReplaced = (event.code === 1000 && (event.reason === 'Replaced by new connection' || event.reason === 'Replaced by same file reconnection'));
                if (wasReplaced) return;
                reconnectAttempts++;
                if (reconnectAttempts <= maxReconnectAttempts) {
                    setTimeout(function () { reconnectPort(port); }, reconnectDelay);
                    reconnectDelay = Math.min(reconnectDelay * 1.5, maxReconnectDelay);
                }
            };

            activeWs.onerror = function () { /* onclose will fire */ };
        }

        function reconnectPort(port) {
            try {
                var testWs = new WebSocket('ws://localhost:' + port);
                var timeout = setTimeout(function () {
                    if (testWs.readyState !== 1) { testWs.close(); scanAndConnect(); }
                }, 2000);
                testWs.onopen = function () {
                    clearTimeout(timeout);
                    activeConnections.push({ port: port, ws: testWs });
                    console.log('[FC Bridge] Reconnected to port ' + port);
                    attachWsHandlers(testWs, port);
                    initializeConnection(testWs);
                };
                testWs.onerror = function () { clearTimeout(timeout); scanAndConnect(); };
            } catch (e) { scanAndConnect(); }
        }

        function scanAndConnect() {
            if (isScanning) return;
            isScanning = true;

            var portsToTry = [];
            for (var p = FC_PORT_START; p <= FC_PORT_END; p++) {
                if (!isPortConnected(p)) portsToTry.push(p);
            }
            if (portsToTry.length === 0) { isScanning = false; return; }

            console.log('[FC Bridge] Scanning ports ' + FC_PORT_START + '-' + FC_PORT_END + '...');
            var foundAny = false;
            var pendingCount = portsToTry.length;

            portsToTry.forEach(function (port) {
                try {
                    var testWs = new WebSocket('ws://localhost:' + port);
                    var timeout = setTimeout(function () {
                        if (testWs.readyState !== 1) testWs.close();
                    }, 3000);

                    testWs.onopen = function () {
                        clearTimeout(timeout);
                        foundAny = true;
                        activeConnections.push({ port: port, ws: testWs });
                        console.log('[FC Bridge] Connected to MCP server on port ' + port + ' (' + activeConnections.length + ' total)');
                        attachWsHandlers(testWs, port);
                        initializeConnection(testWs);
                        pendingCount--;
                        if (pendingCount <= 0) {
                            isScanning = false;
                            if (foundAny) { reconnectDelay = 500; reconnectAttempts = 0; }
                        }
                    };

                    testWs.onerror = function () {
                        clearTimeout(timeout);
                        pendingCount--;
                        if (pendingCount <= 0) {
                            isScanning = false;
                            if (!foundAny && activeConnections.length === 0) {
                                reconnectAttempts++;
                                if (reconnectAttempts <= maxReconnectAttempts) {
                                    setTimeout(scanAndConnect, reconnectDelay);
                                    reconnectDelay = Math.min(reconnectDelay * 1.5, maxReconnectDelay);
                                }
                            }
                        }
                    };

                    testWs.onclose = function () {
                        clearTimeout(timeout);
                        pendingCount--;
                        if (pendingCount <= 0 && !foundAny && activeConnections.length === 0) {
                            isScanning = false;
                            reconnectAttempts++;
                            if (reconnectAttempts <= maxReconnectAttempts) {
                                setTimeout(scanAndConnect, reconnectDelay);
                                reconnectDelay = Math.min(reconnectDelay * 1.5, maxReconnectDelay);
                            }
                        }
                    };
                } catch (e) { pendingCount--; }
            });
        }

        // Start scanning + periodic rescan to discover new servers (local dev only)
        if (!isCloudMode) {
            scanAndConnect();
            setInterval(function () { scanAndConnect(); }, 15000);
        } else {
            console.log('[FC Bridge] Skipping local port scan (cloud mode)');
        }

        // Expose cloud relay connect for Southleft Figma Console (production/preview)
        // Called when the webapp receives a connect_fc_cloud_relay broadcast from Supabase
        var _fcCloudRelayWs = null;
        window.__connectFCCloudRelay = function(code) {
            if (_fcCloudRelayWs && _fcCloudRelayWs.readyState <= 1) {
                console.log('[FC Bridge] Cloud relay already connected');
                return;
            }
            var relayUrl = 'wss://figma-console-mcp.southleft.com/ws/pair?code=' + code;
            console.log('[FC Bridge] Cloud relay connecting with code ' + code);
            try {
                _fcCloudRelayWs = new WebSocket(relayUrl);
                _fcCloudRelayWs.onopen = function() {
                    console.log('[FC Bridge] Cloud relay connected');
                    activeConnections.push({ port: 'cloud', ws: _fcCloudRelayWs });
                    attachWsHandlers(_fcCloudRelayWs, 'cloud');
                    initializeConnection(_fcCloudRelayWs);
                    // Override onclose to clean up cloud relay state
                    var originalOnClose = _fcCloudRelayWs.onclose;
                    _fcCloudRelayWs.onclose = function(event) {
                        console.log('[FC Bridge] Cloud relay disconnected');
                        _fcCloudRelayWs = null;
                        if (originalOnClose) originalOnClose(event);
                    };
                };
                _fcCloudRelayWs.onerror = function() {
                    console.log('[FC Bridge] Cloud relay connection FAILED for code ' + code);
                    _fcCloudRelayWs = null;
                };
            } catch(e) {
                console.error('[FC Bridge] Cloud relay error:', e);
                _fcCloudRelayWs = null;
            }
        };

        // Expose instant connect for Temporal subprocess notification
        // Called when the webapp receives a connect_fc_port broadcast from Supabase
        window.__connectFCPort = function(port) {
            if (isPortConnected(port)) {
                console.log('[FC Bridge] Already connected to port ' + port);
                return;
            }
            console.log('[FC Bridge] Instant connect requested for port ' + port);
            try {
                var ws = new WebSocket('ws://localhost:' + port);
                ws.onopen = function() {
                    activeConnections.push({ port: port, ws: ws });
                    console.log('[FC Bridge] Instant connect OK → port ' + port + ' (' + activeConnections.length + ' total)');
                    attachWsHandlers(ws, port);
                    initializeConnection(ws);
                    reconnectDelay = 500;
                    reconnectAttempts = 0;
                };
                ws.onerror = function() {
                    console.log('[FC Bridge] Instant connect FAILED for port ' + port);
                };
            } catch(e) { /* ignore */ }
        };
    })();

    // ── Guardian Bridge Client ──────────────────────────────────────────────────
    // Connects to the BridgeServer running in the Electron overlay (ws://localhost:3002).
    // Enables bidirectional communication: Electron ↔ Figma plugin/widget.
    //
    // Source of truth (TypeScript): packages/bridge/src/client.ts
    // This inline version mirrors that code for browser/Figma plugin context.
    // ───────────────────────────────────────────────────────────────────────────
    (function initGuardianBridge() {
        if (isCloudMode) {
            console.log('[Guardian Bridge] Skipping Electron overlay connection (cloud mode)');
            return;
        }
        const BRIDGE_PORT = 3002;
        let ws = null;
        let clientId = null;
        let reconnectTimer = null;
        const RECONNECT_DELAY = 3000;

        // Client type is 'plugin' by default.
        // The widget sends a GUARDIAN_MODE message early in its onClick handler,
        // which upgrades clientType to 'widget' before (or just after) WS REGISTER.
        let guardianClientType = 'plugin';
        let guardianWidgetId = undefined;

        function connect() {
            try {
                ws = new WebSocket('ws://localhost:' + BRIDGE_PORT);
            } catch (e) {
                scheduleReconnect();
                return;
            }

            ws.addEventListener('open', function () {
                console.log('[Guardian Bridge] Connected to Electron (:' + BRIDGE_PORT + ')');
                ws.send(JSON.stringify({
                    type: 'REGISTER',
                    clientType: guardianClientType,
                    widgetId: guardianWidgetId,
                    fileKey: cachedFigmaContext?.fileKey ?? undefined,
                    fileName: cachedFigmaContext?.fileName ?? undefined,
                }));
                // Persist connection status so the widget canvas can display it
                parent.postMessage({ pluginMessage: {
                    type: 'storage-set',
                    data: { key: 'guardianBridgeStatus', value: JSON.stringify({ connected: true, ts: Date.now() }) }
                }}, '*');
            });

            ws.addEventListener('message', function (event) {
                try {
                    const msg = JSON.parse(event.data);
                    if (msg.type === 'REGISTERED') {
                        clientId = msg.clientId;
                        console.log('[Guardian Bridge] Registered as', clientId);
                        return;
                    }
                    handleElectronMessage(msg);
                } catch (e) { /* ignore */ }
            });

            ws.addEventListener('close', function () {
                clientId = null;
                console.log('[Guardian Bridge] Disconnected — retry in ' + RECONNECT_DELAY + 'ms');
                // Persist disconnection so the widget canvas can reflect it
                parent.postMessage({ pluginMessage: {
                    type: 'storage-set',
                    data: { key: 'guardianBridgeStatus', value: JSON.stringify({ connected: false, ts: Date.now() }) }
                }}, '*');
                scheduleReconnect();
            });

            ws.addEventListener('error', function () { /* close will fire */ });
        }

        function scheduleReconnect() {
            if (reconnectTimer) return;
            reconnectTimer = setTimeout(function () {
                reconnectTimer = null;
                connect();
            }, RECONNECT_DELAY);
        }

        function send(msg) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(msg));
            }
        }

        /**
         * Handle a message arriving from the Electron overlay.
         * Most messages are forwarded to figma-plugin/code.ts via parent.postMessage.
         * The plugin's existing EXECUTE_CODE handler can run any Figma API code,
         * making it the universal entry point for "generate Figma objects" requests.
         */
        function handleElectronMessage(msg) {
            console.log('[Guardian Bridge] Message depuis Electron:', msg.type, msg);

            if (msg.type === 'PING') {
                send({ type: 'PONG' });
                return;
            }

            if (msg.type === 'TRIGGER_ANALYSIS') {
                // Ask the webapp to start an AI analysis on the current selection
                sendToWebview({ type: 'trigger-user-analysis' });
                return;
            }

            if (msg.type === 'OPEN_PLUGIN_AND_CONVERSE') {
                // Expand the plugin if currently minimized
                if (document.body.classList.contains('minimized')) setMinimized(false);
                // Reset conversation and trigger a fresh analysis
                sendToWebview({ type: 'reset-conversation' });
                setTimeout(function () {
                    sendToWebview({ type: 'trigger-user-analysis' });
                }, 400);
                return;
            }

            if (msg.type === 'NOTIFY') {
                // Show a Figma notification toast
                parent.postMessage({ pluginMessage: { type: 'notify', data: { message: msg.message } } }, '*');
                return;
            }

            // EXECUTE_CODE, HIGHLIGHT_NODE → forward to plugin code.ts main thread
            // code.ts already handles EXECUTE_CODE (runs arbitrary Figma API JS).
            // HIGHLIGHT_NODE is handled by code.ts after this PR.
            parent.postMessage({ pluginMessage: msg }, '*');
        }

        // ── Forward Figma events to Electron ─────────────────────────────────
        // Patch into the existing window.onmessage to intercept plugin/widget code messages.
        const _originalOnMessage = window.onmessage;
        window.onmessage = function (event) {
            // Forward to original handler first
            if (_originalOnMessage) _originalOnMessage.call(window, event);

            const msg = event.data?.pluginMessage;
            if (!msg) return;

            // ── Widget mode detection ──────────────────────────────────────────
            // code.tsx sends this immediately after figma.showUI() in widget context.
            if (msg.type === 'GUARDIAN_MODE' && msg.mode === 'widget') {
                guardianClientType = 'widget';
                guardianWidgetId = msg.widgetId;
                // Re-register with updated info if already connected
                if (ws && ws.readyState === WebSocket.OPEN && clientId) {
                    ws.send(JSON.stringify({
                        type: 'REGISTER',
                        clientType: 'widget',
                        widgetId: msg.widgetId,
                        fileKey: cachedFigmaContext?.fileKey ?? undefined,
                    }));
                }
                return;
            }

            // Forward EXECUTE_CODE_RESULT back to the BridgeServer so MCP controllers
            // that sent the EXECUTE_CODE request can receive the result.
            if (msg.type === 'EXECUTE_CODE_RESULT') {
                send(msg);
                return;
            }

            // Mirror selection changes to the Electron overlay (only when authenticated)
            if (msg.type === 'selection-changed' && isAuthenticated) {
                send({
                    type: 'SELECTION_CHANGED',
                    nodes: (msg.data?.nodes ?? []).map(function (n) {
                        return { id: n.id, name: n.name, type: n.type, bounds: n.bounds };
                    }),
                    fileKey: cachedFigmaContext?.fileKey ?? undefined,
                });
            }
        };

        // Forward auth state changes to the Electron overlay
        document.addEventListener('guardian-auth-state', function (e) {
            send({ type: 'AUTH_STATE', authenticated: e.detail.authenticated });
        });

        // Expose a re-register hook so the rest of the UI can push file context
        // updates (fileKey + fileName) once they become available — the initial
        // REGISTER fires when the WS opens, often before figma-context-init has
        // populated cachedFigmaContext.
        window.__guardianBridgeReRegister = function () {
            if (!ws || ws.readyState !== WebSocket.OPEN || !clientId) return;
            ws.send(JSON.stringify({
                type: 'REGISTER',
                clientType: guardianClientType,
                widgetId: guardianWidgetId,
                fileKey: cachedFigmaContext?.fileKey ?? undefined,
                fileName: cachedFigmaContext?.fileName ?? undefined,
            }));
        };

        connect();
    })();

    // Keepalive ping: wakes up the widget every 5 s so its execution context stays alive.
    // The widget's figma.ui.onmessage handles 'ping' when in keepalive mode; it is silently
    // ignored by the plugin message handler when the full Guardian UI is active.
    setInterval(function () {
        parent.postMessage({ pluginMessage: { type: 'ping' } }, '*');
    }, 5000);
</script>
